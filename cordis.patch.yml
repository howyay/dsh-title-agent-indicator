# dsh-title-agent-indicator bundle patch: inserts its plugin row into the web
# plugin roster. A single row mounts the package. This plugin has no host
# behaviour — the browser half (exports "./client") is declared by `dsh.client`
# in package.json and served from this package's lib/client.js by the client
# module host.
- insert:
    - id: title-agent-indicator
      name: dsh-title-agent-indicator
